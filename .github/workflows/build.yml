name: Build Client

# 触发方式:
#   1) 推 v* tag 自动触发 (例: git push github-client refs/tags/v0.0.1)
#   2) GitHub Actions 页面手动 Run workflow
#
# 产物在每次 run 的 "Artifacts" 区域下载,保留 30 天:
#   - tomato-windows-x64    Win10/11 安装包 (.exe)
#   - tomato-macos-arm64    Apple Silicon (M1/M2/M3/M4) (.dmg / .app)
#
# Intel Mac 已停产 (Apple 2020 年开始过渡到 ARM,2023 全线 ARM),不再
# 单独构建 — 节省 ~30 分钟 CI 时间和 macOS runner 的 10× 配额消耗。
# 万一未来有 Intel Mac 用户:Apple Rosetta 2 透明跑 ARM 二进制,只是
# 启动稍慢一点,功能完全一样。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 即使 build 失败也保存缓存。失败前编出来的 deps 仍然有效,
          # 不缓存就意味着下一次失败之前还得从头重编 deps。
          cache-on-failure: true
          # 把不同 matrix job (Win + Mac) 的缓存隔开 — 它们用不同
          # 的 toolchain 工具,共用 key 反而互相覆盖。
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 先把两个 sidecar 二进制 (donut-proxy / donut-daemon) 编译到对应平台的
      # target 目录,再按 Tauri 期望的命名规则复制到 src-tauri/binaries/。
      # tauri.conf.json 的 externalBin 引用的是 binaries/donut-proxy(无后缀),
      # Tauri 在打包时会自动按 target 后缀去找对应文件。
      #
      # 用 `release-ci` profile (定义在 Cargo.toml):比默认 release 编译快
      # 约 30-50% (lto=false + codegen-units=16),代价是二进制大几十 MB,
      # 运行慢 ~10% — KOL 工具感知不到。
      - name: Build sidecar binaries
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build --bin donut-proxy --target ${{ matrix.target }} --profile release-ci
          cargo build --bin donut-daemon --target ${{ matrix.target }} --profile release-ci
          mkdir -p binaries
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release-ci/donut-proxy.exe \
               binaries/donut-proxy-${{ matrix.target }}.exe
            cp target/${{ matrix.target }}/release-ci/donut-daemon.exe \
               binaries/donut-daemon-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release-ci/donut-proxy \
               binaries/donut-proxy-${{ matrix.target }}
            cp target/${{ matrix.target }}/release-ci/donut-daemon \
               binaries/donut-daemon-${{ matrix.target }}
            chmod +x binaries/donut-proxy-${{ matrix.target }}
            chmod +x binaries/donut-daemon-${{ matrix.target }}
          fi

      - name: Build Tauri app
        env:
          # tauri.conf.json 的 beforeBuildCommand 会调 copy-proxy-binary.mjs,
          # 这两个变量决定它从哪个 target 目录拷 sidecar。PROFILE 跟下面
          # `--profile release-ci` 必须一致。
          TARGET: ${{ matrix.target }}
          PROFILE: release-ci
        run: pnpm tauri build --target ${{ matrix.target }} --profile release-ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tomato-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release-ci/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release-ci/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release-ci/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release-ci/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 30
