services:
  server:
    build: ./server
    container_name: tomato-server
    ports:
      - "8099:8099"
    environment:
      - HOST=0.0.0.0
      - PORT=8099
      - DATABASE_URL=postgres://tomato:tomato123@postgres:5432/tomato_kol
      - DATABASE_MAX_CONNECTIONS=100
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secure-jwt-secret-key-at-least-32-chars}
      - JWT_EXPIRATION_HOURS=8760
      - RUST_LOG=tomato_server=info,actix_web=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tomato-postgres
    environment:
      - POSTGRES_USER=tomato
      - POSTGRES_PASSWORD=tomato123
      - POSTGRES_DB=tomato_kol
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomato -d tomato_kol"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tomato-redis
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
