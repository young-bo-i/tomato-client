[package]
name = "tomato-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "streams"] }

# JWT
jsonwebtoken = "9"

# Password hashing
argon2 = "0.5"

# HTTP client (for platform API proxies)
reqwest = { version = "0.12", features = ["json", "cookies"] }

# Scheduling
tokio-cron-scheduler = "0.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Config
dotenvy = "0.15"

# Regex (for text filtering)
regex = "1"

# Email (for income notifications)
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# System
num_cpus = "1"

# Error handling
anyhow = "1"
thiserror = "2"
