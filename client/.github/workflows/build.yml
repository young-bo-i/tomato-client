name: Build Client

# 触发方式:
#   1) 推 v* tag 自动触发 (例: git push github-client refs/tags/v0.0.1)
#   2) GitHub Actions 页面手动 Run workflow
#
# 产物在每次 run 的 "Artifacts" 区域下载,保留 30 天:
#   - tomato-windows-x64    Win10/11 安装包 (.exe)
#   - tomato-macos-arm64    Apple Silicon (.dmg / .app)
#   - tomato-macos-x64      Intel Mac (.dmg / .app)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 先把两个 sidecar 二进制 (donut-proxy / donut-daemon) 编译到对应平台的
      # target 目录,再按 Tauri 期望的命名规则复制到 src-tauri/binaries/。
      # tauri.conf.json 的 externalBin 引用的是 binaries/donut-proxy(无后缀),
      # Tauri 在打包时会自动按 target 后缀去找对应文件。
      - name: Build sidecar binaries
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build --bin donut-proxy --target ${{ matrix.target }} --release
          cargo build --bin donut-daemon --target ${{ matrix.target }} --release
          mkdir -p binaries
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/donut-proxy.exe \
               binaries/donut-proxy-${{ matrix.target }}.exe
            cp target/${{ matrix.target }}/release/donut-daemon.exe \
               binaries/donut-daemon-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/donut-proxy \
               binaries/donut-proxy-${{ matrix.target }}
            cp target/${{ matrix.target }}/release/donut-daemon \
               binaries/donut-daemon-${{ matrix.target }}
            chmod +x binaries/donut-proxy-${{ matrix.target }}
            chmod +x binaries/donut-daemon-${{ matrix.target }}
          fi

      - name: Build Tauri app
        env:
          # tauri.conf.json 的 beforeBuildCommand 会调 copy-proxy-binary.mjs,
          # 这两个变量决定它从哪个 target 目录拷 sidecar。
          TARGET: ${{ matrix.target }}
          PROFILE: release
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tomato-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 30
